[package]
name = "minimal-video-editor"
version = "0.1.0"
description = "A lightweight, keyboard-first lossless video editor"
edition = "2021"
rust-version = "1.85"

[lib]
name = "minimal_video_editor"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
getrandom = "0.3"
http-range = "0.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
